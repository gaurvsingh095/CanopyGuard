name: CanopyGuard deterministic regression
on: [push, pull_request]
jobs:
  rules-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:build
      - run: npm run test:engine
